<!DOCTYPE html>
<html>
<head>
  <title>WS Test</title>
</head>
<body>

<h3>WebSocket Test</h3>

<input id="token" placeholder="Paste JWT token here" style="width:400px"><br><br>
<input id="conversation" placeholder="Conversation ID" style="width:400px"><br><br>
<input id="message" placeholder="Message" style="width:400px"><br><br>

<button onclick="connect()">Connect</button>
<button onclick="sendMessage()">Send</button>

<pre id="log"></pre>

<script>
let ws;

function log(msg) {
  document.getElementById("log").textContent += msg + "\n";
}

function connect() {
  const token = document.getElementById("token").value;
  ws = new WebSocket(`ws://localhost:8080/ws?token=${token}`);

  ws.onopen = () => log("Connected");
  ws.onmessage = e => log("Received: " + e.data);
  ws.onerror = e => log("Error");
  ws.onclose = () => log("Disconnected");
}

function sendMessage() {
  const conv = document.getElementById("conversation").value;
  const msg = document.getElementById("message").value;

  ws.send(JSON.stringify({
    conversation_id: conv,
    content: msg
  }));
}
</script>

</body>
</html>
